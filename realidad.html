<h1>🌟 Realidad o Fantasía 🌟</h1>
 
<p style="color:black; font-size:18px; max-width:700px; margin:0 auto 25px;">
  Responde a cada afirmación seleccionando <b>Verdadero</b> o <b>Falso</b>.
  Después de contestar, verás si has acertado y una breve explicación.
</p>
 
<div id="quiz"></div>
 
<script>
 
const preguntas = [
{
    texto: "En el sexo tofo fluye y las palabras.",
    correcta: false,
    explicacion: "Es importante decir lo que te gusta y lo que no te gusta y preguntar a la otra persona."
},
{
    texto: "La pornografía representa roles de género.",
    correcta: true,
    explicacion: "En la pornografía el hombre tiene un rol de dominante y la mujer un rol de sumisa."
},
{
    texto: "El consentimiento aumenta el placer.",
    correcta: true,
    explicacion: "Si hablas con la otra persona y te da su consentimiento podéis hacer realidad las fantasías disfrutando los dos."
},
{
    texto: "A veces las chicas dicen que no están muy seguras de “hacerlo” pero lo dicen para hacerse de rogar, en realidad si quieren y hay que insistir. ",
    correcta: false,
    explicacion: "El consentimiento tiene que ser explicito y si no dice directamente que no hay que respetarlo."
},
{
    texto: "En la pornografía las mujeres son cosificadas, son tratadas como objetos.",
    correcta: true,
    explicacion: "En la mayoría de los videos a las mujeres se las trata como juguetes sexuales."
},
{
    texto: "Lo que vemos en el porno es lo que le gusta a la mayoría.",
    correcta: false,
    explicacion: "Cada persona tiene sus preferencias y no tiene que coincidir con lo que aparece en los videos de pornografía. "
},
{
    texto: "La mejor manera de aprender del sexo en con el porno.",
    correcta: false,
    explicacion: "La pornografía no se ajusta a la realidad y no refleja temas tan importantes como el consentimiento y la comunicación."
},
{
    texto: "La pornografía romantiza las violaciones.",
    correcta: true,
    explicacion: "Las secuelas devastadoras de una violación nunca se reflejan en los videos."
}
];
 
const contenedor = document.getElementById("quiz");
 
preguntas.forEach((pregunta, index) => {
    const div = document.createElement("div");
    div.classList.add("pregunta");
 
    div.innerHTML = `
        <p>${index + 1}. ${pregunta.texto}</p>
        <button id="v-${index}" onclick="responder(${index}, true)">Verdadero</button>
        <button id="f-${index}" onclick="responder(${index}, false)">Falso</button>
        <div id="resultado-${index}" class="resultado"></div>
    `;
 
    contenedor.appendChild(div);
});
 
function responder(index, respuesta) {
    const pregunta = preguntas[index];
    const btnV = document.getElementById(`v-${index}`);
    const btnF = document.getElementById(`f-${index}`);
    const resultado = document.getElementById(`resultado-${index}`);
 
    btnV.disabled = true;
    btnF.disabled = true;
 
    if (respuesta === pregunta.correcta) {
        if (respuesta === true) btnV.classList.add("correcto");
        else btnF.classList.add("correcto");
 
        resultado.style.color = "green";
        resultado.innerHTML = "✔ Correcto<br>" + pregunta.explicacion;
 
    } else {
        if (respuesta === true) btnV.classList.add("incorrecto");
        else btnF.classList.add("incorrecto");
 
        if (pregunta.correcta === true) btnV.classList.add("correcto");
        else btnF.classList.add("correcto");
 
        resultado.style.color = "red";
        resultado.innerHTML = "✘ Incorrecto<br>" + pregunta.explicacion;
    }
}
 
</script>
